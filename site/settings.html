<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · UtilityLog</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --danger:#dc2626; --ok:#059669;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--sub:#9ca3af;--line:#374151;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:20px;margin:0 0 4px}
  .hint{color:var(--sub);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .card p.desc{color:var(--sub);font-size:12.5px;margin:0 0 14px}
  label{display:block;font-size:13px;margin:10px 0 4px;color:var(--sub)}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
  button{padding:8px 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;
    font-size:13.5px;cursor:pointer;font-family:inherit}
  button:hover{opacity:.9}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.danger{background:var(--danger)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    word-break:break-all}
  .keybox{background:var(--bg);border:1px dashed var(--line);border-radius:8px;
    padding:10px 12px;margin:10px 0}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;
    background:#dbeafe;color:#1e40af}
  .tag.owner{background:#dcfce7;color:#166534}
  .msg{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:8px}
  .msg.ok{background:#dcfce7;color:#166534}
  .msg.err{background:#fee2e2;color:#991b1b}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:500;font-size:12px}
  .nav{display:flex;gap:14px;margin-bottom:16px;font-size:13px}
  .nav a{color:var(--brand);text-decoration:none}
  .nav a:hover{text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>设置</h1>
  <div class="hint" id="whoami">加载中…</div>
  <div class="nav">
    <a href="/">← 返回看板</a>
    <a href="/logout">退出登录</a>
  </div>

  <!-- API Key -->
  <div class="card">
    <h2>API Key</h2>
    <p class="desc">供 AI 技能或外部脚本调用（Bearer Token）。完整值仅在生成时显示一次。</p>
    <div class="keybox">
      <div class="mono" id="keyDisplay">尚未生成</div>
    </div>
    <div class="row">
      <button id="btnGenKey">生成 / 重置</button>
      <button class="ghost" id="btnCopyKey" disabled>复制</button>
      <span class="hint" style="margin:0">重置会使旧 Key 立即失效</span>
    </div>
    <div id="keyMsg"></div>
    <div id="keyList" style="margin-top:14px"></div>
  </div>

  <!-- 修改密码 -->
  <div class="card">
    <h2>修改密码</h2>
    <p class="desc">修改后所有已登录会话将失效，需要重新登录。</p>
    <label for="oldPass">原密码</label>
    <input type="password" id="oldPass" autocomplete="current-password">
    <label for="newPass">新密码（至少 6 位）</label>
    <input type="password" id="newPass" autocomplete="new-password">
    <label for="newPass2">确认新密码</label>
    <input type="password" id="newPass2" autocomplete="new-password">
    <div class="row"><button id="btnChangePass">修改密码</button></div>
    <div id="passMsg"></div>
  </div>

  <!-- 家庭共享 -->
  <div class="card">
    <h2>家庭共享</h2>
    <p class="desc">
      共享后对方拥有<strong>同等管理权限</strong>：可查看、上传、修改、删除该家庭的账单。
      仅家庭拥有者可以增删成员。
    </p>
    <div id="familyList"><div class="hint">加载中…</div></div>
  </div>

<script>
const $ = id => document.getElementById(id);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showMsg(el, text, kind){
  el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`;
  if (kind === "ok") setTimeout(() => { el.innerHTML = ""; }, 4000);
}

async function api(path, opts){
  const r = await fetch(path, Object.assign({credentials:"same-origin"}, opts||{}));
  let data = null;
  try { data = await r.json(); } catch(e) { data = {ok:false, error:"响应解析失败"}; }
  if (r.status === 401){
    location.href = "/login.html";
    throw new Error("未登录");
  }
  return {status:r.status, data};
}

// ---------- 用户信息 ----------
async function loadMe(){
  try{
    const {data} = await api("/api/me");
    if (data.ok){
      const u = data.user;
      $("whoami").textContent = `当前账号：${u.username}` +
        (u.display_name && u.display_name !== u.username ? `（${u.display_name}）` : "");
    }
  } catch(e){}
}

// ---------- API Key ----------
let plainKey = "";

async function loadTokens(){
  try{
    const {data} = await api("/api/tokens");
    if (!data.ok) return;
    const list = data.tokens || [];
    // 服务端在列表为空时会自动签发一把，并随这次响应一次性返回明文。
    // 必须在这里接住 —— 否则用户拿到的是一把自己从未见过明文的 Key，等于不可用。
    if (data.one_time_plaintext){
      plainKey = data.one_time_plaintext;
      $("keyDisplay").textContent = plainKey;
      $("btnCopyKey").disabled = false;
      showMsg($("keyMsg"), "已自动生成一把 API Key，请立即复制保存（之后只能看到前缀）", "ok");
    }
    if (!list.length){
      $("keyList").innerHTML = `<div class="hint">还没有 API Key</div>`;
      return;
    }
    const rows = list.map(t => `<tr>
      <td class="mono">${esc(t.prefix)}</td>
      <td>${esc(t.created_at || "-")}</td>
      <td>${esc(t.last_used || "从未使用")}</td>
    </tr>`).join("");
    $("keyList").innerHTML = `<table>
      <thead><tr><th>Key</th><th>创建时间</th><th>最近使用</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  } catch(e){}
}

$("btnGenKey").onclick = async () => {
  if (!confirm("重置后旧 Key 立即失效，使用旧 Key 的技能/脚本需更新。继续？")) return;
  const btn = $("btnGenKey");
  btn.disabled = true;
  try{
    const {data} = await api("/api/tokens/reset", {method:"POST"});
    if (data.ok){
      plainKey = data.token;
      $("keyDisplay").textContent = plainKey;
      $("btnCopyKey").disabled = false;
      showMsg($("keyMsg"), "已生成新 Key，请立即复制保存（之后只能看到前缀）", "ok");
      loadTokens();
    } else {
      showMsg($("keyMsg"), data.error || "生成失败", "err");
    }
  } catch(e){
    showMsg($("keyMsg"), "请求失败：" + e.message, "err");
  } finally { btn.disabled = false; }
};

$("btnCopyKey").onclick = async () => {
  if (!plainKey) return;
  try{
    await navigator.clipboard.writeText(plainKey);
    showMsg($("keyMsg"), "已复制到剪贴板", "ok");
  } catch(e){
    // 剪贴板不可用时选中文本让用户手动复制
    const r = document.createRange();
    r.selectNodeContents($("keyDisplay"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    showMsg($("keyMsg"), "自动复制失败，已选中文本，请按 ⌘C / Ctrl+C", "err");
  }
};

// ---------- 修改密码 ----------
$("btnChangePass").onclick = async () => {
  const oldP = $("oldPass").value, newP = $("newPass").value, newP2 = $("newPass2").value;
  if (!oldP || !newP) return showMsg($("passMsg"), "请填写原密码与新密码", "err");
  if (newP !== newP2) return showMsg($("passMsg"), "两次输入的新密码不一致", "err");
  if (newP.length < 6) return showMsg($("passMsg"), "新密码至少 6 位", "err");
  const btn = $("btnChangePass");
  btn.disabled = true;
  try{
    const {data} = await api("/api/password", {
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({old:oldP, new:newP}).toString()
    });
    if (data.ok){
      showMsg($("passMsg"), "密码已修改，即将跳转登录页…", "ok");
      setTimeout(() => location.href = "/login.html", 1200);
    } else {
      showMsg($("passMsg"), data.error || "修改失败", "err");
    }
  } catch(e){
    showMsg($("passMsg"), "请求失败：" + e.message, "err");
  } finally { btn.disabled = false; }
};

// ---------- 家庭共享 ----------
async function loadFamilies(){
  try{
    const {data} = await api("/api/families");
    if (!data.ok) return;
    const fams = data.families || [];
    if (!fams.length){
      $("familyList").innerHTML = `<div class="hint">还没有家庭</div>`;
      return;
    }
    const blocks = [];
    for (const f of fams){
      blocks.push(`<div style="border:1px solid var(--line);border-radius:10px;
        padding:12px;margin-bottom:12px" data-fid="${Number(f.id)}">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b>${esc(f.name)}</b>
          <span class="tag ${f.role === "owner" ? "owner" : ""}">
            ${f.role === "owner" ? "拥有者" : "共享成员"}</span>
          ${f.role !== "owner" && f.owner ? `<span class="hint"
            style="margin:0">来自 ${esc(f.owner)}</span>` : ""}
        </div>
        <div class="members" style="margin-top:10px">
          <div class="hint">加载成员…</div>
        </div>
        ${f.can_manage_members ? `
        <div class="row">
          <input list="userOptions" class="shareInput" placeholder="用户名"
            style="max-width:200px">
          <button class="btnShare" data-fid="${Number(f.id)}">共享给此用户</button>
        </div>` : `<div class="hint" style="margin-top:8px">
          仅拥有者可管理成员</div>`}
      </div>`);
    }
    $("familyList").innerHTML = blocks.join("") +
      `<datalist id="userOptions"></datalist>`;

    // 成员列表
    for (const f of fams){
      loadMembers(f.id);
    }
    // 可选用户
    const ures = await api("/api/users");
    if (ures.data.ok){
      $("userOptions").innerHTML = (ures.data.users || [])
        .map(u => `<option value="${esc(u.username)}">`).join("");
    }
    // 共享按钮
    document.querySelectorAll(".btnShare").forEach(b => {
      b.onclick = async () => {
        const fid = b.dataset.fid;
        const inp = b.parentElement.querySelector(".shareInput");
        const target = (inp.value || "").trim();
        if (!target) return alert("请输入用户名");
        b.disabled = true;
        try{
          const {data} = await api(`/api/families/${fid}/members`, {
            method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({username:target}).toString()
          });
          if (data.ok){ inp.value = ""; loadMembers(fid); }
          else alert(data.error || "共享失败");
        } catch(e){ alert("请求失败：" + e.message); }
        finally { b.disabled = false; }
      };
    });
  } catch(e){}
}

async function loadMembers(fid){
  const box = document.querySelector(`[data-fid="${fid}"] .members`);
  if (!box) return;
  try{
    const {data} = await api(`/api/families/${fid}/members`);
    if (!data.ok) { box.innerHTML = `<div class="hint">${esc(data.error || "读取失败")}</div>`; return; }
    const members = data.members || [];
    const rows = members.map(m => `<tr>
      <td>${esc(m.username)}</td>
      <td><span class="tag ${m.role === "owner" ? "owner" : ""}">
        ${m.role === "owner" ? "拥有者" : "成员"}</span></td>
      <td>${m.role === "owner" ? "" :
        `<button class="ghost btnRemove" data-fid="${Number(fid)}"
          data-user="${esc(m.username)}" style="padding:3px 10px;font-size:12px">移除</button>`}</td>
    </tr>`).join("");
    box.innerHTML = `<table><thead><tr><th>成员</th><th>角色</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    box.querySelectorAll(".btnRemove").forEach(b => {
      b.onclick = async () => {
        if (!confirm(`取消 ${b.dataset.user} 对该家庭的共享？`)) return;
        b.disabled = true;
        try{
          const {data} = await api(
            `/api/families/${b.dataset.fid}/members/remove`, {
            method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({username:b.dataset.user}).toString()
          });
          if (data.ok) loadMembers(fid);
          else alert(data.error || "取消失败");
        } catch(e){ alert("请求失败：" + e.message); }
        finally { b.disabled = false; }
      };
    });
  } catch(e){}
}

loadMe();
loadTokens();
loadFamilies();
</script>
</body>
</html>
